<text x="112" y="1020" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#202d43">处理链路：输入 → 混合解析 → 结果</text>
<rect x="60" y="1094" width="476" height="247" rx="16" fill="#fffefa" stroke="#d5dce6"/>
<text x="83" y="1120" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#202d43">输入入口</text>
<text x="83" y="1180" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">GitHub：API 读取文件和历史</text>
<text x="83" y="1217" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">本地：目录、文件、ZIP</text>
<text x="83" y="1254" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">CLI：本地服务与文件监听</text>
<text x="83" y="1291" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">Card：CI runner 读取源码</text>
<rect x="562" y="1094" width="476" height="247" rx="16" fill="#ebeffa" stroke="#d5dce6"/>
<text x="585" y="1120" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#355bbb">浏览器核心分析</text>
<text x="585" y="1180" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">JS/TS：Babel → Acorn 语法树</text>
<text x="585" y="1217" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">Python：Tree-sitter 引用识别</text>
<text x="585" y="1254" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">解析器不可用时走回退规则</text>
<text x="585" y="1291" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">函数归属 → 文件关系 → 指标</text>
<rect x="1064" y="1094" width="476" height="247" rx="16" fill="#fffefa" stroke="#d5dce6"/>
<text x="1087" y="1120" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#202d43">展示与输出</text>
<text x="1087" y="1180" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">React 界面 + D3 关系图</text>
<text x="1087" y="1217" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">关联文件与潜在影响候选</text>
<text x="1087" y="1254" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">结构、安全与模式提示</text>
<text x="1087" y="1291" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">报告、图导出与 SVG 指标卡</text>
<text x="60" y="1367" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="400" fill="#5d6d80">主文件图由函数引用推断；独立 Architecture 图还使用导入与代码特征规则。</text>
<text x="60" y="1400" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#5d6d80">Card / 无界面入口复用分析源码，但使用解析回退规则，结果可能与浏览器不同。</text>
<text x="60" y="1430" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#355bbb">03</text>
<text x="112" y="1427" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#202d43">影响教学：沿已识别的关系，最多追踪三层</text>
<text x="112" y="1475" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">以下为自编文件链，非真实仓库分析。箭头表示提供者 → 使用者。</text>
