<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2310" viewBox="0 0 1600 2310" role="img" aria-labelledby="title desc">
<title id="title">CodeFlow 完整能力与原理概览</title>
<desc id="desc">原创研究图，包含六组能力、输入输出、混合解析链路、三层影响教学示例、Ix 对比与静态分析边界。</desc>
<rect width="1600" height="2310" fill="#f6f5f1"/>
<text x="60" y="44" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#5d6d80">项目研究集 / 002</text>
<text x="60" y="98" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="76" font-weight="700" fill="#202d43">CodeFlow</text>
<text x="60" y="207" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="43" font-weight="700" fill="#355bbb">让代码结构可见，帮助确定检查范围</text>
<text x="60" y="280" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#5d6d80">读取 GitHub 仓库或本地项目，生成交互式关系图、分析线索与报告。</text>
<text x="60" y="319" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#5d6d80">核心分析依靠静态解析、图遍历和规则；结果仍需回到源码、测试和运行证据核对。</text>
<rect x="60" y="388" width="1480" height="100" rx="16" fill="#ebeffa" stroke="#ebeffa"/>
<text x="86" y="414" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#355bbb">浏览器内分析</text>
<text x="480" y="419" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#202d43">完整下载后可离线读本地文件</text>
<text x="1095" y="419" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#202d43">主图以文件为节点</text>
<text x="60" y="526" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#355bbb">01</text>
<text x="112" y="523" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#202d43">六组能力：从结构浏览到报告复用</text>
<rect x="60" y="594" width="476" height="182" rx="16" fill="#fffefa" stroke="#d5dce6"/>
<text x="83" y="617" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#202d43">01 / 图与代码浏览</text>
<text x="83" y="664" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">文件关系、目录与分层视图</text>
<text x="83" y="696" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">关联源码卡片、拖动与缩放</text>
<text x="83" y="731" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#137c77">适合：接手陌生项目</text>
<rect x="562" y="594" width="476" height="182" rx="16" fill="#fffefa" stroke="#d5dce6"/>
<text x="585" y="617" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#202d43">02 / 潜在改动影响</text>
<text x="585" y="664" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">文件直接与间接使用者</text>
<text x="585" y="696" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">PR 变更范围与影响提示</text>
<text x="585" y="731" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#137c77">适合：修改前确定检查范围</text>
<rect x="1064" y="594" width="476" height="182" rx="16" fill="#fffefa" stroke="#d5dce6"/>
<text x="1087" y="617" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#202d43">03 / 结构与规则提示</text>
<text x="1087" y="664" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">循环依赖、耦合、疑似死代码</text>
<text x="1087" y="696" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">重复、模式、安全提示与健康分</text>
<text x="1087" y="731" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#137c77">适合：寻找值得核查的线索</text>
<rect x="60" y="800" width="476" height="182" rx="16" fill="#fffefa" stroke="#d5dce6"/>
<text x="83" y="823" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#202d43">04 / Git 历史观察</text>
<text x="83" y="870" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">按提交记录显示活跃度</text>
