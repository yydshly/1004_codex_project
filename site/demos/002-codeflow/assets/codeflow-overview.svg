<text x="585" y="870" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">Markdown 相对链接与双链</text>
<text x="585" y="902" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">Obsidian 笔记的连接图</text>
<text x="585" y="937" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#137c77">适合：浏览知识库关联</text>
<rect x="1064" y="800" width="476" height="182" rx="16" fill="#fffefa" stroke="#d5dce6"/>
<text x="1087" y="823" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#202d43">06 / 报告与指标卡片</text>
<text x="1087" y="870" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">JSON、Markdown、文本与图导出</text>
<text x="1087" y="902" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">CLI、无界面分析、Action SVG</text>
<text x="1087" y="937" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#137c77">适合：报表与指标展示</text>
