<text x="60" y="1798" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#355bbb">04</text>
<text x="112" y="1795" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#202d43">与 Ix 的区别：快速浏览与持久结构查询</text>
<rect x="60" y="1871" width="726" height="225" rx="16" fill="#ebeffa" stroke="#ebeffa"/>
<text x="85" y="1891" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#355bbb">CodeFlow</text>
<text x="85" y="1944" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">主要交付：交互文件图、提示与报告</text>
<text x="85" y="1977" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">运行方式：浏览器；CLI / Action 扩展</text>
<text x="85" y="2010" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">保存方式：摘要缓存、导出与指标历史</text>
<text x="85" y="2043" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">更适合：临时阅读、结构展示和报表</text>
<rect x="814" y="1871" width="726" height="225" rx="16" fill="#e7f2ee" stroke="#e7f2ee"/>
<text x="839" y="1891" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#137c77">Ix</text>
<text x="839" y="1944" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">主要交付：持久实体图、结构查询与上下文</text>
<text x="839" y="1977" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">运行方式：CLI / MCP / Compass 共用后端</text>
<text x="839" y="2010" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">保存方式：数据库、增量图补丁与修订</text>
<text x="839" y="2043" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#5d6d80">更适合：长期查询与 Agent 上下文复用</text>
<rect x="60" y="2126" width="1480" height="109" rx="16" fill="#faf0df" stroke="#faf0df"/>
<text x="84" y="2146" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#976328">采用边界</text>
<text x="236" y="2147" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#976328">两者都含启发式解析；持久化和更细粒度不等于已证明准确率更高。</text>
<text x="84" y="2191" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#976328">CodeFlow GitHub API 模式最多 750 文件；单文件超过 2 MB 保留信息但跳过内容解析。</text>
<text x="60" y="2263" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#5d6d80">原创研究示意 · 整理 2026-10-05 · 源码核查 2026-10-04 / b0e82d127fc4 · 证据见研究文档</text>
</svg>
