name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "projects.json"
      - "scripts/catalog.py"
      - "scripts/test_catalog.py"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up research page builder
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build nature project research pages
        run: node projects/003-cozy-nature-worlds/build-research.mjs
      - name: Build DSPy research page
        run: node projects/009-dspy/build-research.mjs
      - name: Generate static catalog and demos
        run: python scripts/catalog.py sync
      - name: Test catalog rendering and page associations
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate catalog
        run: python scripts/catalog.py check
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
