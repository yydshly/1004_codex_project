name: Check project catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up research page builder
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check nature research pages match source documents
        run: node projects/003-cozy-nature-worlds/build-research.mjs --check
      - name: Check DSPy research page matches source notes
        run: node projects/009-dspy/build-research.mjs --check
      - name: Check registry and generated files
        run: python scripts/catalog.py check
      - name: Test catalog compatibility
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
